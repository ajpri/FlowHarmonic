<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>FlowHarmonic — Sign in</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/sign-in.js" defer></script>
</head>
<body>
  <main class="sign-in-page">
    <h1>FlowHarmonic</h1>
    <h2>Sign in</h2>
    <p id="sign-in-status" role="status">Checking sign-in…</p>
    <form id="sign-in-form" method="post" action="/api/auth/sign-in" hidden>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128" autofocus>
      <button id="sign-in-submit" type="submit">Sign in</button>
      <p>This browser stays signed in. Sign out on shared devices.</p>
    </form>
    <p id="sign-in-error" role="alert" hidden></p>
    <noscript>Enable JavaScript to sign in.</noscript>
  </main>
</body>
</html>
